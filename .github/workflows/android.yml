name: Build Android APK

# Manual: se corre desde la pestaña Actions → "Build Android APK" → Run workflow.
# Compila la web SIN base path (build:native), sincroniza Capacitor y arma un
# APK release + un AAB, firmados de verdad con el keystore de producción
# (secret ANDROID_KEYSTORE_BASE64 + contraseñas/alias — sin eso el build
# falla explícito en vez de publicar algo sin firmar o roto). Sube los dos
# como artifacts del run y, si corre desde `main`, además publica el APK en
# el release `android-latest` (link de descarga directo y estable,
# github.com/<repo>/releases/latest). El AAB es el formato que exige Play
# Store para publicar — se sube a Play Console a mano.
#
# Paso a paso para generar el keystore y cargarlo a Play App Signing:
# docs/16-CAPACITOR.md.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8 requiere Node >= 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 compila las libs Android con source 21

      - run: npm ci

      # SIN VITE_BASE_PATH: la build nativa se sirve desde la raíz del webview.
      - name: Build web + Capacitor sync
        run: npm run build:native
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Fail early if the signing keystore secret is missing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 (o está vacío) — sin firma de release no se publica nada. Ver docs/16-CAPACITOR.md."
          exit 1

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Assemble release APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}

      - name: Verify the AdMob App ID landed in the merged manifest
        # Si esto falta, el SDK de Google Mobile Ads crashea la app AL ABRIR
        # (ver el comentario en AndroidManifest.xml) — se falla acá en vez de
        # publicar un APK/AAB que no abre.
        run: |
          MANIFEST=$(find android/app/build -name AndroidManifest.xml -path "*release*" | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::No se encontró el AndroidManifest.xml procesado de release"
            exit 1
          fi
          grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST" || {
            echo "::error::Falta el APPLICATION_ID de AdMob en $MANIFEST"
            exit 1
          }

      - name: Rename artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gymtracker.apk
          cp android/app/build/outputs/bundle/release/app-release.aab gymtracker.aab

      - uses: actions/upload-artifact@v4
        with:
          name: gymtracker-apk
          path: gymtracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gymtracker-aab
          path: gymtracker.aab

      - name: Publish to android-latest release
        # Solo desde main: un APK armado desde otra rama (features a medio
        # terminar, flags distintos) no tiene que pisar el release público
        # que la gente instala. Desde otra rama el APK y el AAB siguen
        # disponibles como artifacts del run para probar.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Repe para Android (último build)
          body: |
            APK firmado de la última versión (release, no debug). Descargá
            `gymtracker.apk` y abrilo en el teléfono — Android igual va a
            avisar "origen desconocido" al instalar algo fuera de Play, eso
            es esperable al instalar así, no un problema de esta build.
          prerelease: true
          files: gymtracker.apk
