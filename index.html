<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <!--
      CSP (B7). Acota a lo que la app realmente usa: Supabase (auth + sync),
      la API/login de Spotify, las carátulas de Spotify y los tiles de
      OpenStreetMap (mapa de running). `'unsafe-inline'` en script es por el
      bootstrap de tema de acá abajo; en style, por los estilos inline de
      React/Tailwind/Leaflet. Endurecer script-src a hashes es un follow-up
      que necesita verificación en navegador. Bloquea framing, plugins y
      destinos de red/formulario desconocidos.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.scdn.co https://*.spotifycdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.supabase.co https://accounts.spotify.com https://api.spotify.com; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>GymTracker</title>
    <!-- Sin webfonts a propósito: la app usa la fuente del sistema (SF Pro en
         iOS, Roboto en Android). Se ve mejor en el dispositivo real, no
         bloquea el render, y no depende de una red que en un gimnasio puede
         no existir. Ver DESIGN.md §2. -->
    <script>
      // Setea data-theme ANTES del primer paint. Sin esto, un usuario en modo
      // claro ve un flash oscuro al cargar mientras React monta y recién ahí
      // lee la preferencia. No puede importar src/stores/themeStore.ts (ese
      // código todavía no corrió), así que lee localStorage directo con el
      // mismo formato que persiste zustand.
      (function () {
        try {
          var raw = localStorage.getItem('gymtracker-theme')
          var theme = raw ? JSON.parse(raw).state.theme : 'dark'
          if (theme === 'light') {
            document.documentElement.dataset.theme = 'light'
            document.documentElement.style.colorScheme = 'light'
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F2F2F5')
          }
        } catch (e) {
          // localStorage inaccesible (modo privado estricto, etc.) — se
          // queda en oscuro, que es el default de :root.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
